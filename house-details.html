<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Detail — Ravenhurst Prep Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'EB Garamond', serif;
    background:#f3ebde;
    color:#1c2c4d;
  }

  /* ---------- NAV (dark, matches hero) ---------- */
  .nav-wrap{
    background:#0b0e14;
    border-bottom:1px solid rgba(201,168,106,.25);
  }
  .nav{
    max-width:1440px; margin:0 auto; padding:28px 64px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:14px; text-decoration:none;}
  .crest-img{height:52px; width:auto; display:block;}
  .wordmark{font-family:'Cormorant Garamond', serif; font-weight:700; font-size:22px; letter-spacing:.1em; color:#f2ead9;}
  .wordmark .sub{display:block; font-family:'EB Garamond', serif; font-weight:600; font-size:10.5px; letter-spacing:.25em; color:#c9a86a; margin-top:2px;}
  .navlinks{display:flex; align-items:center; gap:34px;}
  .navlinks a{
    font-family:'EB Garamond', serif; font-weight:600; font-size:13px; letter-spacing:.16em;
    text-transform:uppercase; color:#f2ead9; text-decoration:none;
  }
  .navlinks a.active{color:#c9a86a;}

  /* ---------- SECTION HEADER ---------- */
  .section-head{
    max-width:1000px; margin:0 auto; padding:64px 24px 8px; text-align:center;
  }
  .eyebrow{
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:'EB Garamond', serif; font-weight:600; font-size:13px; letter-spacing:.34em;
    color:#a5824a; text-transform:uppercase; margin-bottom:18px;
  }
  .eyebrow .ln{width:32px; height:1px; background:#a5824a;}
  h1{
    font-family:'Cormorant Garamond', serif; font-weight:700;
    font-size:44px; letter-spacing:.02em; margin-bottom:14px; color:#16233c;
  }
  .section-sub{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
    font-size:17px; color:#5c5847; max-width:520px; margin:0 auto 8px;
  }

  .stage{
    max-width:1000px; margin:0 auto; padding:32px 24px 100px;
    display:flex; justify-content:center;
  }
  .diagram{max-width:820px; width:100%;}
  .diagram img{display:block; width:100%; height:auto;}

  .back-link{
    display:block; text-align:center; padding-bottom:90px;
    font-family:'EB Garamond', serif; font-weight:600; font-size:13px; letter-spacing:.14em;
    text-transform:uppercase; color:#5c5847; text-decoration:underline; text-underline-offset:4px;
  }
  .back-link:hover{color:#16233c;}

  @media (max-width:900px){
    .nav{padding:20px 20px;}
    .navlinks a{display:none;}
    .section-head{padding:44px 20px 4px;}
    h1{font-size:30px;}
    .section-sub{font-size:15px;}
    .stage{padding:24px 16px 60px;}
    .crest-img{height:40px;}
    .wordmark{font-size:18px;}
  }
</style>
</head>
